name: Forms Transp - Pipeline Diario

on:
  workflow_dispatch:
  schedule:
    # 00:00 no horario de Brasilia (UTC-3).
    - cron: "0 3 * * *"

concurrency:
  group: forms-transp-pipeline-diario
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      USUARIO: ${{ secrets.USUARIO }}
      SENHA: ${{ secrets.SENHA }}

      GOBEAUTY_APICE_USUARIO: ${{ secrets.GOBEAUTY_APICE_USUARIO }}
      GOBEAUTY_APICE_SENHA: ${{ secrets.GOBEAUTY_APICE_SENHA }}
      GOBEAUTY_BARBOURS_USUARIO: ${{ secrets.GOBEAUTY_BARBOURS_USUARIO }}
      GOBEAUTY_BARBOURS_SENHA: ${{ secrets.GOBEAUTY_BARBOURS_SENHA }}
      GOBEAUTY_LESCENT_USUARIO: ${{ secrets.GOBEAUTY_LESCENT_USUARIO }}
      GOBEAUTY_LESCENT_SENHA: ${{ secrets.GOBEAUTY_LESCENT_SENHA }}

      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      FORMS_TRANSP_API_URL: "https://formstransp.vercel.app/api/jobs/import-pedidos"
      PEDIDOS_IMPORT_SECRET: ${{ secrets.PEDIDOS_IMPORT_SECRET }}
      FORMS_TRANSP_ENVIAR_BACKEND: "1"

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar pipeline diario
        run: python scripts/drive/orquestrador-diario.py
