name: Gerar arquivos de download

on:
  workflow_dispatch:
    inputs:
      admin_only:
        description: "Gerar somente a Base Completa administrativa"
        type: boolean
        default: false
  schedule:
    # 07:00 no horário de Brasília (UTC-3).
    - cron: "0 10 * * *"

concurrency:
  group: gerar-arquivos-download
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Gerar e publicar arquivos
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.admin_only }}" = "true" ]; then
            npm run exports:generate -- --admin-only
          else
            npm run exports:generate
          fi
